<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sign in — NEO BRICKS</title>
<link rel="stylesheet" href="css/style.css?v=transport1">
<link rel="stylesheet" href="css/login.css?v=motion1">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NEO BRICKS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" sizes="32x32" href="icons/nb-32-v2.png">
<meta name="theme-color" content="#102536">
<link rel="apple-touch-icon" href="icons/nb-180-v2.png">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
</head>
<body class="signin-page">



<div class="login-wrap">
  <div class="login-card">
    <div class="login-arrival" aria-hidden="true"></div>
    <h1 class="brand-lockup" id="loginBrand"><span>NEO BRICKS</span></h1>
    <p class="login-subtitle">Your factory. Everything in one place.</p>
    <div id="msg" class="msg bad hidden"></div>
    <form id="loginForm">
      <h2>Welcome back</h2>
      <p class="login-help">Sign in to your workspace.</p>
      <label for="username"><i data-lucide="user-round" class="icon"></i>Username</label>
      <input id="username" type="text" required autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Enter your username">
      <label for="password"><i data-lucide="lock-keyhole" class="icon"></i>Password</label>
      <input id="password" type="password" required autocomplete="current-password" placeholder="Enter your password">
      <button type="submit" class="primary">Sign in <span aria-hidden="true">→</span></button>
    </form>
  </div>
</div>

<script src="js/login-motion.js?v=motion1"></script>
<script src="js/api-security1.js?v=ui-live1"></script>
<script src="js/pwa.js?v=ui-live1"></script>
<script>
if (window.lucide) lucide.createIcons();

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  const msgEl = document.getElementById("msg");

  try {
    const data = await apiFetch("/login", { method: "POST", body: { username, password } });
    sessionStorage.setItem("access_token", data.access_token);
    sessionStorage.setItem("username", data.username);
    sessionStorage.setItem("role", data.role);
    window.location.href = data.role === "admin" ? "admin.html" : "manager.html";
  } catch (err) {
    msgEl.textContent = err.message;
    msgEl.classList.remove("hidden");
  }
});
</script>
</body>
</html>
