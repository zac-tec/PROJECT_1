<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Brick Factory Login</title>
<link rel="stylesheet" href="css/style.css?v=redesign1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17191c">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="brand-intro" aria-hidden="true"><div class="brand-intro-word" aria-label="NEO BRICKS"><span>N</span><span>E</span><span>O</span><span>&nbsp;</span><span>B</span><span>R</span><span>I</span><span>C</span><span>K</span><span>S</span></div></div>

<div class="login-wrap">
  <div class="login-card">
    <h1 class="brand-lockup"><span>NEO BRICKS</span></h1>
    <div id="msg" class="msg bad hidden"></div>
    <form id="loginForm">
      <label for="username"><i data-lucide="user-round" class="icon"></i>Username</label>
      <input id="username" type="text" required autocomplete="username">
      <label for="password"><i data-lucide="lock-keyhole" class="icon"></i>Password</label>
      <input id="password" type="password" required autocomplete="current-password">
      <button type="submit" class="primary">Log In</button>
    </form>
  </div>
</div>

<script src="js/api-security1.js?v=security1"></script>
<script src="js/mock-api.js?v=redesign1"></script>
<script src="js/pwa.js"></script>
<script>
lucide.createIcons();

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  const msgEl = document.getElementById("msg");

  try {
    const data = await apiFetch("/login", { method: "POST", body: { username, password } });
    sessionStorage.setItem("access_token", data.access_token);
    sessionStorage.setItem("username", data.username);
    sessionStorage.setItem("role", data.role);
    window.location.href = data.role === "admin" ? "admin.html" : "manager.html";
  } catch (err) {
    msgEl.textContent = err.message;
    msgEl.classList.remove("hidden");
  }
});
</script>
</body>
</html>
